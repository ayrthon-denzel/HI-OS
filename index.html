<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#061018" />
  <meta name="color-scheme" content="dark" />
  <meta name="referrer" content="no-referrer" />
  <meta name="description" content="HI OS — Operating System de HI MARKETING" />
  <title>HI OS — HI MARKETING</title>
  <link rel="stylesheet" href="./styles.css?v=1.6.0" />
  <link rel="stylesheet" href="./job.css?v=1.6.0" />
  <link rel="stylesheet" href="./reference-v6.css?v=1.1.0" />
  <link rel="stylesheet" href="./workspace.css?v=1.0.0" />
  <link rel="stylesheet" href="./copilot-fix.css?v=1.0.1" />
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar">
      <div class="brand-block" aria-label="HI MARKETING"><img src="./assets/hi-marketing-official.jpg?v=1.2.0" alt="HI MARKETING" class="official-brand-logo" /><div class="brand-name"><strong>HI OS</strong><span>Operating System</span></div></div>
      <nav class="nav" id="nav"></nav>
      <div class="sidebar-help"><div class="sidebar-status-dot"></div><div><strong>HI OS</strong><small>Prêt à travailler</small></div></div>
    </aside>
    <main class="main">
      <header class="topbar"><div class="page-heading"><p class="eyebrow">HI MARKETING</p><h1 id="pageTitle">Accueil</h1></div><div class="top-actions"><button class="ghost assistant-launch" id="toggleCopilot" aria-expanded="false" aria-controls="copilot">✦ Assistant</button><button class="ghost" id="openApprovals">Validations <span class="badge" id="approvalCount">0</span></button><div class="user-copy"><span>Bonjour,</span><strong>A-D PANIKA</strong><small>CEO — HI MARKETING</small></div><button class="profile" aria-label="Profil A-D PANIKA">AD</button></div></header>
      <section id="content"></section>
    </main>
    <div class="copilot-backdrop" id="copilotBackdrop"></div>
    <aside class="copilot" id="copilot" aria-hidden="true"><div class="copilot-head"><div><p class="eyebrow">HI ASSISTANT</p><h2>Que veux-tu faire ?</h2></div><div class="copilot-head-actions"><span class="live">● En ligne</span><button class="copilot-minimize" id="minimizeCopilot" type="button" aria-label="Réduire l'assistant" title="Réduire">−</button><button class="copilot-close" id="closeCopilot" type="button" aria-label="Fermer l'assistant" title="Fermer">×</button></div></div><div class="messages" id="messages"><div class="msg system">Bonjour A-D. Dis-moi ton objectif, je te guide vers la bonne action.</div></div><div class="quick-actions" id="quickActions"><button data-cmd="Trouve de nouveaux clients qualifiés pour HI MARKETING.">Trouver des clients</button><button data-cmd="Prépare le contenu de la semaine pour HI MARKETING.">Créer du contenu</button><button data-cmd="Résume les réponses commerciales reçues aujourd'hui.">Voir mes priorités</button></div><form class="composer" id="chatForm"><textarea id="chatInput" placeholder="Écris ta demande ici…" rows="3"></textarea><div class="composer-row"><span>HI OS s’occupe du reste</span><button type="submit">Envoyer</button></div></form></aside>
  </div>
  <dialog id="approvalDialog"><div class="dialog-head"><div><p class="eyebrow">VALIDATIONS</p><h2>Décisions importantes</h2></div><button id="closeApprovals" aria-label="Fermer">×</button></div><div class="approval-list" id="approvalList"><p style="color:#8e98a5">Chargement…</p></div></dialog>
  <script src="./js/auth.js?v=1.6.0"></script><script src="./js/workspace.js?v=1.0.0"></script><script src="./js/app.js?v=1.6.0"></script><script src="./js/job-service.js?v=1.6.0"></script><script src="./js/live-api.js?v=1.6.0"></script><script src="./js/ui-premium.js?v=1.6.0"></script>
</body></html>
